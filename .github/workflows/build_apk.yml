name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: '构建 Android APK'
        required: false
        default: true
        type: boolean
      build_windows:
        description: '构建 Windows'
        required: false
        default: true
        type: boolean
      build_linux:
        description: '构建 Linux'
        required: false
        default: true
        type: boolean
      create_release:
        description: '创建 GitHub Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release 标签 (如 v1.0.1)'
        required: false
        default: 'v1.0.1'
        type: string

jobs:
  build_android:
    name: Android APK
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.build_android == 'true' || github.event.inputs.build_android == '' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - run: flutter pub get
    - run: flutter build apk --release
    - uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    name: Windows EXE
    runs-on: windows-latest
    if: ${{ github.event.inputs.build_windows == 'true' || github.event.inputs.build_windows == '' }}
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - run: flutter pub get
    - run: flutter build windows --release
    - uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: build/windows/x64/runner/Release/

  build_linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.build_linux == 'true' || github.event.inputs.build_linux == '' }}
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
    - run: flutter pub get
    - run: flutter build linux --release
    - uses: actions/upload-artifact@v4
      with:
        name: linux-bundle
        path: build/linux/x64/release/bundle/

  release:
    name: Create Release & Upload
    needs: [build_android, build_windows, build_linux]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.create_release == 'true' }}
    steps:
    - uses: actions/checkout@v4

    - name: Download Android APK
      uses: actions/download-artifact@v4
      with:
        name: android-apk
        path: ./artifacts/

    - name: Download Windows EXE
      uses: actions/download-artifact@v4
      with:
        name: windows-exe
        path: ./artifacts/windows/

    - name: Download Linux Bundle
      uses: actions/download-artifact@v4
      with:
        name: linux-bundle
        path: ./artifacts/linux/

    - name: Package Windows ZIP
      run: |
        cd ./artifacts/windows
        zip -r ../../smart-learning-windows.zip .

    - name: Package Linux ZIP
      run: |
        cd ./artifacts/linux
        zip -r ../../smart-learning-linux.zip .

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag }}
        name: "智慧学习 ${{ github.event.inputs.release_tag }}"
        body: |
          ## 智慧学习 ${{ github.event.inputs.release_tag }}

          ### 🎯 功能特性
          - 📚 知识点管理
          - 📝 学习笔记
          - ❌ 错题本（AI自动拆分录入）
          - ⭐ 必记本
          - 📖 母题库
          - 📝 模拟测试（AI自动生成试卷+判分解析）
          - 🧠 思维导图（AI自动生成）
          - 📊 学情分析（AI深度分析+学习建议）
          - 🔍 搜索功能
          - 📋 试卷集管理
          - 🖨️ 组合打印
          - 🔥 习惯打卡
          - 🤖 AI助手（支持多种大模型）

          ### 🤖 支持的AI大模型
          | 模型 | 类型 | 说明 |
          |:---|:---|:---|
          | Google Gemini | 在线免费 | gemini-1.5-flash |
          | Groq | 在线免费 | llama-3.1-8b-instant |
          | 智谱AI | 在线免费 | glm-4-flash / glm-4.7-flash |
          | 通义千问 | 在线免费 | qwen-turbo |
          | Ollama | 本地 | llama3.2 等 |

          ### 📥 安装方法
          #### Android
          1. 下载 `smart-learning-android.apk`
          2. 打开文件管理器，找到下载的 APK
          3. 点击安装（可能需要允许"未知来源"）

          #### Windows
          1. 下载 `smart-learning-windows.zip`
          2. 解压 ZIP 文件
          3. 运行 `smart_learning_app.exe`

          #### Linux
          1. 下载 `smart-learning-linux.zip`
          2. 解压 ZIP 文件
          3. 给执行文件添加权限：`chmod +x smart_learning_app`
          4. 运行：`./smart_learning_app`
        files: |
          ./artifacts/app-release.apk
          ./smart-learning-windows.zip
          ./smart-learning-linux.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
